schema_version: 2
scientific_question: How large an exactly verified rational Diophantine tuple can be constructed, beyond the known size-six frontier?
artifact: A finite set of exact nonzero rationals whose pairwise products plus one are rational squares.
oracle:
  exact: canonical Fraction reduction followed by perfect-square checks on every numerator and denominator using integer square roots
  feasibility: JSON-safe integer numerator-denominator pairs, at most 64 submitted pairs, per-integer and total-digit resource limits, and at least two distinct nonzero rationals
  deterministic: true
normalization:
  baseline: the classical integer quadruple {1, 3, 8, 120}
  reference: Gibbs's published positive rational sextuple, recomputed by the same exact oracle
  score: cardinality progress (m - 4) / (6 - 4), lower-bounded at zero and not clipped at the score-one reference; the fixed 64-entry wave has a finite representable maximum of 30
citations:
- id: arXiv:math/9902081
  title: Some Rational Diophantine Sextuples
- id: arXiv:1507.00569
  title: There are infinitely many rational Diophantine sextuples
- id: url:https://epoch.ai/frontiermath/open-problems/diophantine-septuple
  title: A Rational Diophantine Septuple
invariants:
- permutation invariance of the submitted set
- rational-representation invariance after canonical reduction
- sign normalization of denominators
- duplicate-representation idempotence
- the hash-bound panel is the sole source of score anchors and resource limits, while the immutable wave also binds the complete exact evaluator oracle
- fixed-wave score is finite and not clipped at the public reference; only later immutable waves can extend lifetime family credit
known_shortcuts: Published sextuples and parametric sextuple families may occur in training data, so direct retrieval reaches the 1.0 reference and size six is reconstruction rather than discovery. Permutations, equivalent fraction spellings and duplicate padding earn no extra cardinality. The open jump to a septuple may not exist, and the 64-entry safety envelope bounds this wave's representable score at 30; no model-difficulty or indefinitely increasing-score claim is made before HY3 calibration.
