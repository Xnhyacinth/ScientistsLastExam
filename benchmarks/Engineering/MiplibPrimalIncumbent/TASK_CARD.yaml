schema_version: 2
scientific_question: >-
  Can one reusable primal heuristic improve a weak feasible integer assignment on the frozen
  MIPLIB queens-30 binary model, whose dated status is hard and proven optimal?
artifact: >-
  Candidate code implementing improve_primal(problem), returning one dense integer assignment in
  frozen MPS column order for each instance.
oracle:
  model: >-
    A task-local MPS parser checks the hash-bound compressed MPS file, then checks variable
    bounds, every linear row at MIPLIB linear tolerances, and the objective. Duals are never
    consulted.
  feasibility: >-
    Exactly one integer per variable; booleans and floats are rejected; lower/upper bounds and L/G/E
    rows must hold at the frozen tolerances.
  deterministic: true
normalization:
  baseline: the feasible all-zero binary vector, objective 0
  reference: official MIPLIB solufile v36 proven optimum -40 for queens-30
  score: clip01(-objective/40); proven optimum, not an open-incumbent record
citations:
  - id: doi:10.1007/s12532-020-00194-3
    title: "MIPLIB 2017: Data-Driven Compilation of the 6th Mixed-Integer Programming Library"
  - id: web:miplib2017-v36
    title: "MIPLIB 2017 solution file version 36, 2026-01-26"
invariants:
  - >-
    The compressed MPS is hash-bound and parsed on every evaluation; no live download and no
    .sol files.
  - The checker is primal-only. Dual unboundedness or dual feasible rays are not scored.
  - Malformed submissions score zero and never raise out of the evaluator.
  - The model is MIPLIB-hard and proven optimal; score one is not a new library record.
known_shortcuts: >-
  The former gen-ip trio scores 0.996066 under a 60-second-per-model SciPy milp probe
  in the Linux sandbox. It is retired. On queens-30, SciPy 1.11.4 / NumPy 1.26.4,
  a 240-second single-thread milp call in the same sandbox finds 35 queens, score 0.875,
  with zero constraint violation. A 60-second in-process probe also finds 35.
  This removes near-saturation, but library reuse remains strong and calibration is pending.
review:
  status: pending_external
  domain: pending_external_operations_research
  evaluator_security: >-
    Bounded dense-integer response; MPS parser accepts only the named file; malformed
    output scores zero.
provenance:
  class: public_data_replay
  target_source: official MIPLIB queens-30 compressed MPS and solufile v36; archive/content hashes and URLs are recorded in references/anchors.json
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: completed_2026_09_08_against_solufile_v36
novelty_risk:
  level: high
  rationale: >-
    Public instances and published optima may occur in training data. Only a verified feasible
    assignment is scored, and score one is clipped at a proven optimum. Nearest neighbours
    are PermutationFlowShop (scheduling), GraphFromDistances (graph recovery) and
    ShannonCapacityCertificate (exact code/bound certificates), with different artifacts.
