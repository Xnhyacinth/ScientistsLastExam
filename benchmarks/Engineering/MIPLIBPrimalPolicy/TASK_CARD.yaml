    qualification: numerical/continuous candidates were excluded, official historical assignments replaced
    synthetic anchors, and native exit status was rejected after a measured false-success exit.
  shortcut_discoverer: builder_self_audit
  frozen_before_eval: false
  freeze_timestamp: null
