schema_version: 2
scientific_question: Produce an exact rational common quadratic Lyapunov certificate that proves a uniform exponential decay rate for a published switched linear system, independently of the switching signal.
artifact: A 3-by-3 rational Gram matrix P and a positive rational rate alpha such that P is positive definite and A_i^T P + P A_i + alpha P is negative semidefinite on every published mode.
oracle:
  model: exact rational principal-minor criteria on 3-by-3 matrices; no floating-point SDP
  feasibility: integer or [numerator, denominator] entries inside the public magnitude cap; floats, indefinite P, non-positive alpha, or a mode that violates the LMI each score that instance zero
  deterministic: true
normalization:
  baseline: the identity Gram at alpha = 1/10000, which is a valid common Lyapunov function on every instance and scores exactly zero
  reference: a finite catalog of 3-by-3 rational quadratics with exact rational bisection of each feasible rate to the public magnitude resolution
  score: mean of min(max(0, (alpha - 1/10000) / (3/4)), 1) over four 3-by-3 instances; the unit 3/4 is a clip, not a published record
citations:
- id: doi:10.1137/1.9781611970777
  title: "Linear Matrix Inequalities in System and Control Theory"
- id: doi:10.1007/978-0-8176-4297-6
  title: "Switching in Systems and Control"
invariants:
- a valid certificate is a proof, not a simulation of one switching path
- the identity Gram is a Lyapunov function because every published mode has a negative numerical abscissa, but the proven rate is small
- a 3-by-3 Gram with couplings in every plane proves a strictly larger rate on the same modes
- floats are rejected rather than rounded
- malformed submissions score zero and never raise out of the evaluator
known_shortcuts: >-
  After the 3-by-3 redesign, checkpoint-12 probes sit below the reference.
  Identity Gram with exact bisection of alpha: 0.176288. Owner-style 2-parameter
  block-diagonal grid P=[[1,b,0],[b,d,0],[0,0,1]] with 725 Grams and rational
  bisection: 0.206533 in 2.0s (1178 (b,d) pairs in the denser scan, same score).
  The September 9 constant certificate p11=1, p12=-3/5, p22=1, alpha=59/100,
  padded with p13=p23=0, p33=1, is infeasible on every instance and scores 0.
  Reference catalog plus Boyd bisection: 0.366560. A 5488-point 5-DOF rational
  scan reaches 0.458200 in 15s; that gap is leftover catalog headroom, not a
  2-parameter exploit. Spectral mean ceiling if every instance hit 2|Re λ_max|
  is about 0.511.

