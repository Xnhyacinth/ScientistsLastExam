schema_version: 2
scientific_question: Produce an exact rational common quadratic Lyapunov certificate that proves a uniform exponential decay rate for a published switched linear system, independently of the switching signal.
artifact: A 2-by-2 rational Gram matrix P and a positive rational rate alpha such that P is positive definite and A_i^T P + P A_i + alpha P is negative semidefinite on every published mode.
oracle:
  model: exact rational Sylvester criteria on 2-by-2 matrices; no floating-point SDP
  feasibility: integer or [numerator, denominator] entries inside the public magnitude cap; floats, indefinite P, non-positive alpha, or a mode that violates the LMI each score that instance zero
  deterministic: true
normalization:
  baseline: the identity Gram at alpha = 1/10000, which is a valid common Lyapunov function on every instance and scores exactly zero
  reference: a finite catalog of sheared rational quadratics with exact rational bisection of each feasible rate to the public magnitude resolution
  score: mean of min(max(0, (alpha - 1/10000) / (3/4)), 1) over four instances; the unit 3/4 is a clip, not a published record
citations:
- id: doi:10.1137/1.9781611970777
  title: "Linear Matrix Inequalities in System and Control Theory"
- id: doi:10.1007/978-0-8176-4297-6
  title: "Switching in Systems and Control"
invariants:
- a valid certificate is a proof, not a simulation of one switching path
- the identity Gram is a Lyapunov function because every published mode has a negative numerical abscissa, but the proven rate is small
- a sheared Gram proves a strictly larger rate on the same modes
- floats are rejected rather than rounded
- malformed submissions score zero and never raise out of the evaluator
known_shortcuts: >-
  Scientific admission blocked: a fixed P=[[1,-3/5],[-3/5,1]], alpha=59/100
  scores 0.786533 without reading the instance. It exceeded the old coarse-rate reference
  0.7498665. The repaired bisection reference scores 0.8496395, already near the approximately
  0.849900 attainable mean ceiling. Maintainer low-dimensional grid/bisection probes also
  approach that ceiling. Rational reconstruction of numerical solutions is possible; only raw
  floating submissions are rejected. These fixed 2-by-2 instances require substantive redesign.

