novelty_risk:
  level: medium
  rationale: >-
    Common quadratic Lyapunov functions for switched linear systems are textbook LMI material. What is scored is an exact rational certificate of a stated rate, which is not a recalled controller gain and cannot be read from a simulation.
    Nearest neighbours BellBoundCertificate and SpherePackingCertificate verify rational
    bounds on different scientific objects; this certificate proves switched ODE decay.
