novelty_risk:
  level: medium
  rationale: >-
    Glen n=3 is textbook. What is not published is which world is GBS, sliding-mixed, a plug or
    a stress-dependent exponent, and the score turns on recovering n without publishing those
    out-of-family worlds. Nearest neighbours are ComplexBoseLaw and EnzymeKineticsLaw. The joint
    stress/temperature design differs, and the two-window reference does not cover the third
    viscous family, so hardness is now a family-identification question rather than a regression one.
