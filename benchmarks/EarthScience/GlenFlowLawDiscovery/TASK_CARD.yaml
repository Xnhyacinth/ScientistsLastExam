schema_version: 2
scientific_question: Jointly recover continuous Glen, Newtonian or GBS exponent, amplitude and thermal response from 12 stress-temperature assays, refusing resolvable sliding mixtures, plugs and stress-dependent n(τ).
artifact: A family, n, log_A, activation_temperature, confidence and optional refusal.
oracle:
  model: procedurally parameterized Glen, Newtonian or Goldsby–Kohlstedt-style GBS creep, plus sliding-mix, plug and stress-dependent n(τ) out-of-family worlds, with frozen Gaussian noise on ln v
  feasibility: charged stress assays, family and exponent recovery on in-family worlds, and calibrated refusal of curved or n-outside-family worlds
  deterministic: true
normalization:
  baseline: always publish Newtonian n=1
  reference: six stress-temperature design points with repeated assays and joint log-linear fitting; two windows (Glen, Newtonian) so GBS worlds are abstained
  score: development mechanism recovery normalized above always-abstain; signal recovery, false discovery, refusal, coverage and the held-out split stay separate
citations:
- id: doi:10.1016/0165-232X(82)90010-6
  title: "Flow parameters for ice sheet modeling"
- id: doi:10.1098/rspa.1955.0066
  title: "The creep of polycrystalline ice"
- id: doi:10.3189/S0022143000024709
  title: "On the sliding of glaciers"
- id: doi:10.1029/2000JB900336
  title: "Superplastic deformation of ice: Experimental observations"
invariants:
- at fixed temperature in-family ice is a single power law; Glen n varies over [2.6,3.6], Newtonian n=1, and GBS n varies over [1.65,2.05]
- sliding added to Glen creep curves log v versus log tau, so no unique n in the family
- the same Arrhenius factor multiplies the Weertman sliding term C*tau as the creep term; a temperature-independent sliding term would have been a free discriminator and is not used
- a plug whose speed does not depend on stress sits outside the family
- a stress-dependent exponent n = n0 + k log10(τ/τ0) curves log-log for a different physical reason than Weertman sliding and must be refused
- declining every world scores exactly zero; the axes separate blanket abstention from confident publication
- measure calls are charged and overspend fails closed; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: >-
  The old t=0.03 scan scored 0.995439 on development and 0 heldout by exploiting frozen noise.
  Former weak sliding worlds now have true curvature 0.25017 / 0.21590, not 0.007 / 0.006.
  The two-window log-linear reference does not label GBS (n around 1.8) and therefore
  abstains on those supported worlds; that is the intended difficulty, not a weakened fit.
  The PR remains draft until the admission band is independently re-checked.

