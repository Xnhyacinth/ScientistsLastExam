novelty_risk:
  level: medium
  rationale: >-
    Glen n=3 is textbook. What is not published is which world is sliding-mixed or a plug, and the score turns on recovering n without publishing those out-of-family worlds.
    Nearest neighbours are ComplexBoseLaw and EnzymeKineticsLaw. The joint stress/temperature
    design differs, but the current linear fit remains strong, so novelty and hardness are unproven.
