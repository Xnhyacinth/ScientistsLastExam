  edits_triggered_by_model: Earlier Terra proposal matched the no-coarse-ambiguity
    reference on 5d91fef. Coarse-screen ambiguity added; three fresh isolated Terra
    CLI proposals tested clean b75dc6cebae38bc66feb5f5e38fb29268af0dc6f. All candidate
    hashes, scores and rejected alternatives recorded in known_best. No registered
    API calibration or maintainer acceptance claimed. Subsequent reference-only review
    selected stronger utility and reporting choices; evaluator and baseline unchanged.
    A clean-tree repository-native batch_evolve calibration on b35783a produced one
    valid first proposal at 0.743401678, below the 0.827795949 reference. Its raw
    report remains uncommitted by contributor policy; hashes and protocol details
