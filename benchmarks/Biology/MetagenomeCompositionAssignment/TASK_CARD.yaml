schema_version: 2
scientific_question: Recover microbial mixture abundances at acquired marker-panel
  resolution and reject jointly inadequate reference libraries.
artifact: Concrete taxon or unresolved-group abundances, or empty-list library refusal.
oracle:
  model: Deterministic conditional multinomial marker mixtures; 24 worlds, positive
    shared-marker residuals and design-dependent profile resolution.
  feasibility: Strict output types, disjoint claims and bounded mass; permanent callback
    invalidity and per-panel replicate streams.
  deterministic: true
normalization:
  baseline: Legal one-panel nearest-single-taxon baseline scores exactly zero.
  reference: 'Sparse-support conditional likelihood, selected-support adaptive utility,
    model-discrimination ordering, joint deviance and development-selected bins500
    reporting: 0.827795949 / 0.828551628, valid=1. The 0.172204051 development
    headroom is entirely abundance-accuracy and avoidable-resolution credit after
    perfect claim precision, alias recovery, refusal and coverage.'
  score: Mass-weighted abundance and resolution credit times claim precision; both
    splits normalize above the 0.25 library-refusal floor.
citations:
- id: doi:10.1038/nmeth.2066
  title: Metagenomic microbial community profiling using unique clade-specific marker
    genes
- id: doi:10.1038/s41467-017-02209-5
  title: Strain profiling and epidemiology of bacterial species from metagenomic sequencing
- id: doi:10.1371/journal.pone.0027992
  title: Accurate Genome Relative Abundance Estimation Based on Shotgun Metagenomic
    Reads
invariants:
- Library and query-menu generation is independent of world category.
- Every profile is positive; noiseless outside-library samples lie inside all coordinatewise
  template envelopes.
- Four query-dependent pairs conserve panel mass; two active pairs have a legal full-resolution
  two-call design.
- Labels and marker rows do not determine biology.
- All-world FDR, intrinsic-alias recovery and library-refusal denominators are separate.
known_shortcuts: Coarse initial markers confound pairs of active strain groups. Best
  of 45 fixed plans 0.687528/0.673133; 156 scalar refusal probes best 0.716685/0.495218;
  development-selected bins500 reporting incorporated. Prior reference-matching Terra
  counterexample retained in known_best.
review:
  domain: pending_external_domain_review
  evaluator_security: internal_budget_rng_alias_residual_schema_and_malformed_output_tests
provenance:
  class: procedural
  target_source: Repository-visible deterministic marker-mixture panels with held-out
    seeds.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
  license: Original synthetic instances and implementation. Papers are citations only;
    no external code or datasets redistributed.
novelty_risk:
  level: medium
  rationale: CrowdedSpectrumAssignment and TransmissionSpectrumSpecies also infer
    distinguishable components. This task uses conditional count likelihoods, charged
    marker panels, group abundances and joint library residuals. MethaneSourceAttribution
    attributes fixed atmospheric source signatures without charged panel choice or
    resolution groups. QuinaryConvexHull and PhaseDiagramDiscovery infer thermodynamic
    stability or phase structure rather than conditional count mixtures; novelty
    requires external review.
