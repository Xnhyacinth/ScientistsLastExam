- id: doi:10.1021/acs.jctc.2c00193
  title: SCINE Chemoton 2.0 - Autonomous Exploration of Chemical Reaction Networks
- id: doi:10.1002/jcc.26734
  title: AutoMeKin2021 - An open-source program for automated reaction discovery
- id: doi:10.1016/j.entcs.2004.12.033
  title: Chemical Graphs, Chemical Reaction Graphs, and Chemical Graph Transformation
- id: doi:10.1039/TF9383400011
  title: Inertia and Driving Force of Chemical Reactions
