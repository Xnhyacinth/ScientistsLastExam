  title: The Activated Complex in Chemical Reactions
invariants:
- no candidate species or candidate reaction catalogue is exposed; every non-seed graph and every edge is constructed by candidate code
- coloured-graph identities are canonical under every element-preserving atom permutation and duplicate canonical species or edges fail closed
- repeated-element mapping ambiguity is resolved by the minimum barrier over every valid one-delete/one-add channel, never by a hidden atom-index tie-break
- the exact analytic oracle is deterministic in a world specification and a canonical directed edge
- supported-world mechanism recovery, edge false-discovery rate, correct unsupported-world refusal, attempted discovery and expected-recovery confidence calibration are reported separately; abstention has recovery target zero
- declining every development world and the shipped confidently wrong edge are valid and normalized to exactly zero
- malformed graphs, invalid transformations, over-budget probes, caught callback violations and malformed artifacts score zero without escaping the evaluator
- held-out worlds change catalyst selectivity and refusal case placement while preserving the public graph grammar
known_shortcuts: >-
  The September 12 source-informed descriptor-fit probe reaches development/heldout
  1.0/1.0 with at most 24 paid calls, zero FDR and development raw 0.9788421717171715,
  above reference raw 0.9316717474829289. It fits channel signatures, reactant bond
  counts and degree second moments from public observations. One-delete/one-add
  preserves cycle count in each connected component, so adding cycle terms did not
  establish hardness. The declared strong shortcut guard fails; scientific admission
  remains blocked. This is a red-team algorithm audit, not a blind model draw.

