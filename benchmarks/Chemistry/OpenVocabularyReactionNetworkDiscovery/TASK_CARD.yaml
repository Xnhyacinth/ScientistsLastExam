  target_source: Repository-visible deterministic analytic graph generator with development and sealed held-out world specifications.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_applicable_synthetic_oracle
novelty_risk:
  level: medium
  rationale: >-
    Reaction-network exploration and graph canonicalization are established. Frontier-Eng reaction tasks optimize continuous conditions or catalysts for fixed known reactions, whereas this cell constructs unlisted species graphs and directed edges, probes barriers, and scores false discovery and refusal without exposing a catalogue. The exact networks are benchmark-specific, and the small grammar makes exhaustive search a known shortcut, so difficulty must be measured rather than inferred.
    Nearest neighbours are ReactionMechanismFitting and EnzymeKineticsLaw; this task
    constructs molecular graphs and elementary edges rather than selecting a supplied law.
lineage:
  status: incomplete_legacy
  builder_model_ids:
  - openai:codex-gpt-5
  builder_scaffolds:
  - codex-cli
  calibrator_model_ids: []
  calibration_runs: []
  calibration_evidence_status: missing
  edits_triggered_by_model: No trusted model calibration was attached at freeze; deterministic review found that an 80-query exhaustive witness saturated the small grammar, a lexicographic atom-map tie-break changed graph-pair truth, and a 1024-ordering BFS sweep beat the first 24-query anchor. Pre-PR domain review also found that confidence mixed expected network recovery with world support on abstention; confidence was made a single expected-recovery estimand with abstention target zero. The budget, oracle semantics, reference, and calibration semantics were revised before release.
  shortcut_discoverer: builder_self_audit
  shortcut_findings:
  - 80-query exhaustive grammar enumeration recovered the complete small-network oracle and exhausted meaningful score headroom.
  - blanket abstention occupied the original shipped baseline and did not exercise false-discovery scoring.
  - repeated C atoms allowed multiple bond-exchange channels whose barriers differed, while the original oracle selected one by lexicographic atom-map order.
  - historically, a 1024-seed BFS neighbour-order sweep reached development raw 0.946080715974333 on the additive-energy oracle.
  - historically, a public-only 13-signature cache reached development/heldout 1.0 with at most 13 probes (mean 8.833333).
  - after graph-dependent barriers, the same signature_probe.py scores combined 0.880621 / development raw 0.860243 against reference 1.000000 / 0.931672.
  - September 12 descriptor-fit red team recovers both splits at score one using only paid responses at runtime.
  remediation:
  - reduce the charged budget to 24 and resolve ambiguous graph-pair barriers as the minimum over all valid atom-map channels
  - replace node-local BFS with novelty-first active-frontier acquisition, a qualitative chemical barrier surrogate, and a public grammar-branching information-gain tie-break
  - add reactant/product cycle counts, degree second moment, and spectator-bond energy so a broken/formed channel table is not the oracle
  - ship a legal confidently wrong edge while retaining blanket abstention as an independent zero-score control
  frozen_before_eval: false
  freeze_timestamp: null
