schema_version: 2
scientific_question: Can a budgeted active policy construct previously unlisted molecular graphs and elementary edges, recover an exact synthetic reaction network, control false discoveries, and refuse null or model-inadequate worlds?
artifact: A canonicalizable coloured-molecular-graph species set, directed bond-exchange reaction set with activation energies, Boolean refusal, and calibrated confidence.
oracle:
  model: Deterministic analytic heavy-atom graph grammar with element-preserving canonicalization, one-bond-exchange edges, exact activation barriers, null worlds, and model-inadequate worlds.
  feasibility: Every probed and submitted graph conserves the atom inventory, is connected and valence-valid; edges obey the public elementary grammar; canonical duplicate species or edges, malformed output, and budget violations fail closed.
  deterministic: true
normalization:
  baseline: Make no probes and decline every world.
  reference: Truth-blind exhaustive enumeration of the public graph grammar followed by charged probing of every grammar-valid directed edge; it is a witness for this small frozen cell, not a scalable global optimum.
  score: Mean supported-network recovery and correct unsupported-world refusal, normalized above the exact always-abstain floor; mechanism recovery, false-discovery rate, calibrated refusal, attempted discovery and held-out transfer remain separate.
citations:
- id: doi:10.1021/acs.jctc.2c00193
  title: SCINE Chemoton 2.0 - Autonomous Exploration of Chemical Reaction Networks
- id: doi:10.1002/jcc.26734
  title: AutoMeKin2021 - An open-source program for automated reaction discovery
invariants:
- no candidate species or candidate reaction catalogue is exposed; every non-seed graph and every edge is constructed by candidate code
- coloured-graph identities are canonical under every element-preserving atom permutation and duplicate canonical species or edges fail closed
- the exact analytic oracle is deterministic in a world specification and a canonical directed edge
- supported-world mechanism recovery, edge false-discovery rate, correct unsupported-world refusal, attempted discovery and confidence calibration are reported separately
- declining every development world is valid and normalized to exactly zero
- malformed graphs, invalid transformations, over-budget probes, caught callback violations and malformed artifacts score zero without escaping the evaluator
- held-out worlds change catalyst selectivity and refusal case placement while preserving the public graph grammar
known_shortcuts: The frozen cell has only four heavy atoms, single bonds, unimolecular bond exchanges and exact noiseless probes, so exhaustive enumeration is feasible and chemistry is highly abstract. Hydrogens, charge, stereochemistry, bond orders, conformers, thermodynamics, kinetics and electronic-structure uncertainty are absent. Scaling those axes requires a new frozen wave and an oracle-cost policy; this cell alone cannot support a real mechanism claim.
