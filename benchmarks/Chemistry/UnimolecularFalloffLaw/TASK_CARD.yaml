schema_version: 2
scientific_question: From budgeted (T,P) assays of ln k, recover whether a unimolecular rate is Lindemann or Troe, including k_inf and Pr at 300 K and 1 bar, and decline when a second pressure-independent channel is open or k falls as pressure rises.
artifact: A family name, log k_inf(300 K), log Pr(300 K, 1 bar), Fcent, a confidence, and an optional refusal.
oracle:
  model: procedurally parameterized Lindemann or Troe falloff, plus two-channel and negative-order out-of-family worlds, with frozen Gaussian noise on ln k
  feasibility: charged (T,P) measurements, family recovery on in-family worlds, and calibrated refusal of two-channel and negative-order worlds
  deterministic: true
normalization:
  baseline: always publish a pressure-independent Arrhenius law as Lindemann
  reference: public reduced-law pressure-curve fit for log k_inf, log Pr and Fcent, BIC family comparison, and high-temperature pressure-order refusal
  score: development mechanism recovery normalized above always-abstain; signal recovery, false discovery, refusal, coverage and the held-out split stay separate
citations:
- id: doi:10.1002/bbpc.19830870218
  title: "Theory of Thermal Unimolecular Reactions in the Fall-off Range. II. Weak Collision Rate Constants"
invariants:
- in-family k interpolates between a third-body low-pressure limit and a high-pressure limit; Lindemann has F=1 and Troe has Fcent in (0,1)
- a second pressure-independent channel leaves a low-P floor, so the apparent reaction order at the lowest pressures is not 1
- k that falls as P rises is outside the family
- declining every world scores exactly zero; the axes separate blanket abstention from confident publication
- measure calls are charged and overspend fails closed; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: >-
  The three-assay probe with the reference family predicate scored 0.746885/0.808437
  against the old 12–13 assay scan at 0.731992/0.776872, because 100 bar was already
  k_inf. After (T,P)-keyed noise and Pr(300 K, 100 bar)=2, the same probe scores
  0.198579/0.324198 against the full-curve reference 0.961337/0.727720. Repeats of
  one (T,P) no longer denoise; log k_inf is an extrapolation. Scientific admission
  and model difficulty remain unproven.

