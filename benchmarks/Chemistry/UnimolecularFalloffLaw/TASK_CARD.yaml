novelty_risk:
  level: medium
  rationale: >-
    Lindemann and Troe are textbook. What is not published is which world is two-channel or negative-order, and the score turns on recovering Fcent and Pr without publishing those out-of-family worlds.
    Nearest neighbours are ReactionMechanismFitting and EnzymeKineticsLaw; this task
    jointly estimates falloff parameters and tests two distinct refusal mechanisms.
