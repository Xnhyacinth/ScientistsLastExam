novelty_risk:
  level: high
  rationale: MUSCL, WENO, TVD limiters, Godunov and SSP Runge--Kutta methods are established. The benchmark contribution is the frozen adaptive method-design search cell and evidence contract, not a claim of a new numerical scheme. A repository-side comparison found no matching task class in either Frontier-Eng's 47-paper-problem appendix or its 95-entry TASK_DETAILS catalogue; this is still not an external novelty certification.
license_and_contamination:
  task_text: Repository-authored benchmark text; no source problem statement is copied verbatim.
  upstream_methods: Method names and equations are attributed to their DOI sources; no external code or dataset is redistributed.
  repository_release: The repository has no top-level license file; public redistribution terms must be resolved by maintainers before release.
  contamination: The named schemes and their standard parameter heuristics may occur in model training data; the exact frozen panel and score-one witness were repository-constructed and must be treated as potentially visible after publication.
