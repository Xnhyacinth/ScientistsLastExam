schema_version: 2
scientific_question: Produce an exact rational linear ranking function, with Farkas multipliers, that proves a uniform decrease on every guard-satisfying state of a published rational affine while-loop over real states.
artifact: A 1-norm ranking vector r, a constant s, a positive delta, and two Farkas multiplier vectors, all rational.
oracle:
  model: exact affine Farkas identities; no floating-point LP
  feasibility: integer or [numerator, denominator] entries inside the public magnitude cap; floats, a ranking whose 1-norm is not 1, non-positive delta, or a failed Farkas identity each score that instance zero
  deterministic: true
normalization:
  baseline: uniform rational ranking at delta=1/10000, exactly zero on every instance
  reference: feasible pair-coordinate rational ascent; coupled directions beyond its local moves remain possible
  score: mean clip01((delta-1/10000)/(optimal_delta-1/10000)); each optimal_delta is proved by exact Farkas cone-ray enumeration and a matching certificate
citations:
- id: doi:10.1007/3-540-45319-9_17
  title: "Synthesis of Linear Ranking Functions"
- id: doi:10.1007/978-3-540-24622-0_20
  title: "A Complete Method for the Synthesis of Linear Ranking Functions"
invariants:
- a valid certificate is a proof of descent on the whole guard polyhedron, not a simulation of one start state
- the 1-norm constraint makes delta comparable across ranking directions
- coordinate-axis rankings fail the coupled transition; every accepted decrease requires nonzero second multipliers
- floats are rejected rather than rounded
- malformed submissions score zero and never raise out of the evaluator
known_shortcuts: >-
  Scientific admission blocked: the public-input inverse_column_probe.py attains score one
  on all four instances. Nonnegative (I-A^T)^-1 makes the feasible rankings a simplex with
  at most n known vertices; coupled A did not remove the original degeneracy. Hiding the
  evaluator optimum and removing stored full certificates do not repair search difficulty.
  A general exact LP also reaches the optimum. No model-hardness claim is supported.

