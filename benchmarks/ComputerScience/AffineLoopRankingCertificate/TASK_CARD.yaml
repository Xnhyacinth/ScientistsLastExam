schema_version: 2
scientific_question: Produce an exact rational lexicographic ranking tuple, with Farkas multipliers, that proves descent on every transition of a published nested-reset rational affine loop over real states.
artifact: A lexicographic tuple of 1-norm ranking vectors, constants, positive deltas, per-transition active indices, and Farkas multiplier blocks, all rational.
oracle:
  model: exact affine Farkas identities on a weak lexicographic ranking; no floating-point LP
  feasibility: integer or [numerator, denominator] entries inside the public magnitude cap; floats, a ranking whose 1-norm is not 1, non-positive delta, unused components, or a failed Farkas identity each score that instance zero
  deterministic: true
normalization:
  baseline: uniform nested ranking at delta=1/10000 per level, exactly zero on every instance
  reference: feasible discrete search over uniform and adjacent pairwise slopes on each block; coupled phase rankings beyond those local moves remain possible
  score: mean clip01((Q - n_levels/10000)/(Q* - n_levels/10000)) with Q the sum of proven component deltas; Q* is a hidden verified nested lex ranking, not a 1-ranking Farkas LP optimum
citations:
- id: doi:10.1007/3-540-45319-9_17
  title: "Synthesis of Linear Ranking Functions (Colón–Sipma, TACAS 2001, LNCS 2031 pp. 67–81)"
- id: doi:10.1007/11513988_24
  title: "Linear Ranking with Reachability"
- id: doi:10.1145/2629488
  title: "Ranking Functions for Linear-Constraint Loops"
invariants:
- a valid certificate is a lexicographic proof of descent on every published transition, not a simulation of one start state
- the 1-norm constraint makes each component delta comparable across ranking directions
- progressing-block guards are overcomplete and not coordinate axes, so Farkas multipliers are not unique functions of r
- "a single linear ranking on the whole system is incomplete: the reset increases any ranking that decreases on the inner progress step"
- floats are rejected rather than rounded
- malformed submissions score zero and never raise out of the evaluator
- valid is 1.0 only if every instance has a valid certificate
known_shortcuts: >-
  The textbook 1-ranking Farkas LP (Colón–Sipma / Podelski–Rybalchenko; references/phase_lp_probe.py
  one_ranking_as_lex) has an exactly certified zero maximum delta on all four instances and scores 0.0 with
  valid 0. Inverse-column enum of a single transition (references/inverse_column_probe.py)
  is a depth-1 attempt and does not reach score one. Discrete uniform nested ranking scores
  0.727504; adding adjacent pairwise search reaches 0.842802. Independent exact phase
  rankings reconstruct the hidden Q* and score 1.0 in the full Linux sandbox.
  The declared phase-LP shortcut guard fails; scientific admission remains blocked.
  Public instances do not disclose Q*.

