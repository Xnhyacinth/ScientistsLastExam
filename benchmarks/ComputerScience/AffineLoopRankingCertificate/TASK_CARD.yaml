novelty_risk:
  level: medium
  rationale: >-
    Linear ranking functions for affine loops are textbook program analysis. What is scored is an exact rational Farkas certificate of a stated decrease at 1-norm 1, which is not a recalled trace and cannot be read from running the loop once.
    Nearest neighbours SpherePackingCertificate, BellBoundCertificate and ShannonCapacityCertificate
    certify other objects; this task proves affine program descent, with known clipped optima.
